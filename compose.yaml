# Local development services only. This is not a deployment template:
# production instances will get their own Compose stack.
name: ottertrail

services:
  postgres:
    image: docker.io/library/postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: ottertrail
      POSTGRES_DB: ottertrail
      # Local development only: no password. The port below listens on
      # 127.0.0.1, so nothing outside this computer can connect.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # 5433 on this computer, so it does not clash with other local Postgres servers.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/<major>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ottertrail -d ottertrail"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Analytics events, and later logs, traces, and metrics (docs/storage-benchmark.md).
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.38.9
    environment:
      CLICKHOUSE_DB: ottertrail
      CLICKHOUSE_USER: ottertrail
      # Local development only: the port below listens on 127.0.0.1.
      CLICKHOUSE_PASSWORD: development
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # The same small-server settings as deployments use.
      - ./deploy/clickhouse/config.d/ottertrail.xml:/etc/clickhouse-server/config.d/ottertrail.xml:ro
      - ./deploy/clickhouse/users.d/ottertrail.xml:/etc/clickhouse-server/users.d/ottertrail.xml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user ottertrail --password development --query 'SELECT 1'",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  clickhouse-data:
