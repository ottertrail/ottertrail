# Version tags publish immutable amd64 and arm64 images and release files.
# Reruns reuse an existing image and retry the release job. Manual runs publish
# only a commit-tagged image. See docs/deployment.md, "Releasing".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Check versions before building so a wrong tag cannot publish an image.
      - name: Check the tag against the versions in the repository
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.ts --check "${TAG#v}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Never overwrite a released image. Build only on "not found"; fail on other registry errors.
      - name: Check whether this version's image is already pushed
        id: released
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE,,}:${TAG#v}"
          if out="$(docker buildx imagetools inspect "$image" 2>&1)"; then
            echo "$image is already in the registry: skipping the build and the push."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qi 'not found'; then
            echo "$image is not in the registry yet: building it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            echo "Could not tell whether $image exists." >&2
            exit 1
          fi

      - id: meta
        if: steps.released.outputs.exists != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - if: steps.released.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Release notes need history back to the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The release's default image version must match its tag.
      - name: Check the tag against the versions in the repository
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.ts --check "${TAG#v}"

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.ts "${TAG#v}" "$TAG" > "$RUNNER_TEMP/notes.md"

      # Reruns replace the release's files and notes.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          files="deploy/compose.yaml deploy/example.env deploy/backup.sh deploy/restore.sh deploy/cloudflare-firewall.sh"
          prerelease=
          case "$version" in *-*) prerelease=--prerelease ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Ottertrail $version" --notes-file "$RUNNER_TEMP/notes.md"
            # shellcheck disable=SC2086 # the file list splits on purpose
            gh release upload "$TAG" $files --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --verify-tag --title "Ottertrail $version" \
              --notes-file "$RUNNER_TEMP/notes.md" $prerelease $files
          fi
