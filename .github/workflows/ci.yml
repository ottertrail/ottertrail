# Run the required checks from docs/development.md, "Commands".
# API tests use development compose.yaml databases; browser tests use headless Chromium.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR checks. Let every main push finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes tests read the repository's history and tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: |
          npm install --global pnpm@12.21.0
          pnpm install --frozen-lockfile

      - name: Start PostgreSQL, ClickHouse, and Garage
        run: docker compose up --detach --wait

      - name: Install Chromium for the browser tests
        run: pnpm --filter @ottertrail/web exec playwright install --with-deps --only-shell chromium

      - name: Check, test, and build
        run: pnpm exec vp run ready

      - name: Show the databases' logs
        if: failure()
        run: docker compose logs --no-color --tail 200
