# Ottertrail on one server: PostgreSQL, ClickHouse, the API (which also
# serves the dashboard and the tracker), the worker, and Caddy, which gets
# HTTPS certificates and is the only service reachable from outside. With
# the "object-store" profile, which example.env turns on, Garage too: it
# holds session replays and source maps.
#
# This file works on its own: put it in an empty folder with a .env made
# from example.env, and run `docker compose up -d`. It runs the published
# image of one release (OTTERTRAIL_VERSION), and holds the settings of
# Caddy, ClickHouse, and Garage at the end (configs). It needs Docker
# Compose 2.23.1 or later; podman-compose cannot run it. Steps:
# https://github.com/ottertrail/ottertrail/blob/main/docs/deployment.md
#
# Not "ottertrail": that is the development stack (compose.yaml at the
# repository root), and the same name would share its database volume.
name: ottertrail-instance

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  # The release this file comes from. `vp run version` sets the default,
  # and the release workflow checks it against the tag.
  image: ghcr.io/ottertrail/ottertrail:${OTTERTRAIL_VERSION:-0.2.0}
  restart: unless-stopped
  logging: *logging
  # Anchored too: the worker adds its own variables to these.
  environment: &app-environment
    NODE_ENV: production
    DATABASE_URL: postgres://ottertrail:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ottertrail
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: ottertrail
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    CLICKHOUSE_DATABASE: ottertrail
    PUBLIC_URL: https://${OTTERTRAIL_DOMAIN:?set OTTERTRAIL_DOMAIN in .env}
    AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    # Requests reach the API only through Caddy, one proxy hop.
    TRUST_PROXY: "1"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    INSTANCE_EVENTS_PER_SECOND: ${INSTANCE_EVENTS_PER_SECOND:-600}
    # Session replays and source maps: off unless OBJECT_STORE_URL is set,
    # to the stack's own Garage (http://garage:3900, the object-store
    # profile) or another S3-compatible store such as Cloudflare R2
    # (docs/deployment.md). With a URL, both keys are required: migrate,
    # the API, and the worker refuse to start without them, and say so in
    # their logs. Compose cannot check them itself: a required value only
    # in some installs needs a nested check, which Docker Compose before
    # 5.0.2 evaluates in every install.
    OBJECT_STORE_URL: ${OBJECT_STORE_URL:-}
    OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-garage}
    OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-ottertrail}
    OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-}
    OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-}
    SOURCE_MAP_STORAGE_BYTES: ${SOURCE_MAP_STORAGE_BYTES:-}
    REPLAY_STORAGE_BYTES: ${REPLAY_STORAGE_BYTES:-}
    # The stack's Garage's admin token (docs/deployment.md, "Storage"):
    # with it, the Settings page shows the bucket's real size and Garage's
    # disk, and the worker keeps a quota on the bucket. Optional: without
    # it, the page says how to turn it on. Never logged or shown.
    GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    # Traces, logs, and metrics over OTLP (docs/telemetry.md): days kept,
    # 30 by default. The migrate service applies it to ClickHouse's tables.
    TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-}
    # Uptime checks may not reach private addresses unless this is true
    # (docs/deployment.md, "Uptime checks"). Off by default.
    UPTIME_ALLOW_PRIVATE_ADDRESSES: ${UPTIME_ALLOW_PRIVATE_ADDRESSES:-false}
    # Addresses and CIDR ranges checks may never reach, such as this
    # server's own public address (docs/deployment.md, "Uptime checks").
    UPTIME_DENY_ADDRESSES: ${UPTIME_DENY_ADDRESSES:-}
    # Alert email (docs/deployment.md, "Alert email"): off unless SMTP_URL
    # is set, with EMAIL_FROM. Webhooks need neither.
    SMTP_URL: ${SMTP_URL:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    # Where the worker reads ClickHouse's backup files for scheduled backups:
    # the clickhouse-backups volume, which ClickHouse writes them into
    # (docs/deployment.md, "Backups"). Only the worker mounts it.
    CLICKHOUSE_BACKUP_PATH: /app/data/backups

services:
  postgres:
    image: docker.io/library/postgres:18.7-alpine3.24
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ottertrail
      POSTGRES_DB: ottertrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/<major>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: on first start the image runs a temporary server on the
      # Unix socket only, which would pass the check before PostgreSQL is ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ottertrail -d ottertrail"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Analytics events, traces, logs, and metrics, with settings for a server
  # it shares (the clickhouse-* configs at the end; docs/storage-benchmark.md).
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.38.9
    restart: unless-stopped
    logging: *logging
    environment:
      CLICKHOUSE_DB: ottertrail
      CLICKHOUSE_USER: ottertrail
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # BACKUP … TO File(…) writes here (the backups setting below), and the
      # worker reads each file from the same volume for scheduled backups.
      - clickhouse-backups:/var/lib/clickhouse/backups
    depends_on:
      backup-folder:
        condition: service_completed_successfully
    labels:
      ottertrail.config.clickhouse-config: "6c7bcf9c0e38"
      ottertrail.config.clickhouse-users: "59ff9fd82108"
    configs:
      - source: clickhouse-config
        target: /etc/clickhouse-server/config.d/ottertrail.xml
      - source: clickhouse-users
        target: /etc/clickhouse-server/users.d/ottertrail.xml
    healthcheck:
      # clickhouse-client takes the password from the container's own
      # CLICKHOUSE_PASSWORD, so it never appears on a command line.
      test: ["CMD", "clickhouse-client", "--user", "ottertrail", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Prepares the clickhouse-backups volume, then exits: owned by ClickHouse's
  # user and group (101 in its image), writable by the group, which the worker
  # joins (group_add below), so the worker can read ClickHouse's backup files
  # and delete each once uploaded. The setgid bit keeps new files in the group.
  # ClickHouse starts after it. ClickHouse's own image, as root, once per start.
  backup-folder:
    image: docker.io/clickhouse/clickhouse-server:26.8.38.9
    restart: "no"
    logging: *logging
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 101:101 /backups && chmod 2770 /backups"]
    volumes:
      - clickhouse-backups:/backups

  # An S3-compatible object store for session replays and source maps, on
  # this server: only with the object-store profile (COMPOSE_PROFILES in
  # .env). It creates its bucket and access key from the same settings the
  # API reads, and nothing outside reaches it. Without GARAGE_RPC_SECRET it
  # stops at once, and `docker compose logs garage` says why
  # (docs/deployment.md, "Session replays and source maps").
  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    profiles: ["object-store"]
    restart: unless-stopped
    logging: *logging
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_DEFAULT_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY_ID:-}
      GARAGE_DEFAULT_SECRET_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${OBJECT_STORE_BUCKET:-ottertrail}
      # The admin API's token (port 3903, inside the Compose network only).
      # Empty when unset: Garage then takes no admin request, since a
      # request cannot send an empty bearer token.
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - garage-data:/var/lib/garage
    labels:
      ottertrail.config.garage: "75102946e710"
    configs:
      - source: garage
        target: /etc/garage.toml
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Brings both schemas up to date, then exits. The API and worker start after it.
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "--enable-source-maps", "dist/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    <<: *app
    # The location database and data-center ranges: the worker keeps them
    # current, and the API loads a new file within 10 minutes. Read-write
    # here too, for `docker compose exec api node dist/update-geo.mjs`.
    volumes:
      - geo-data:/app/data/geo
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Quoted: unquoted, YAML would read "0 : 1" as a key and a value.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "--enable-source-maps", "dist/worker.mjs"]
    # Downloads the location data into the volume the API reads. Reads
    # ClickHouse's backup files from theirs for scheduled backups, as a member
    # of ClickHouse's group (101), which owns that folder.
    volumes:
      - geo-data:/app/data/geo
      - clickhouse-backups:/app/data/backups
    group_add: ["101"]
    # Where scheduled backups go: a bucket of their own, with a key only
    # the worker holds, so a key the internet-facing API holds can't
    # delete them (docs/deployment.md, "Scheduled backups"). Not in the
    # environment above: the API never gets them. Unset, backups can't be
    # turned on; partly set or invalid, the worker logs why and the
    # Backups tab shows it.
    environment:
      <<: *app-environment
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    # On shutdown the worker lets running uptime checks finish and records
    # them: up to 30 seconds each, past Compose's default 10.
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: docker.io/library/caddy:2.11.9-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      OTTERTRAIL_DOMAIN: ${OTTERTRAIL_DOMAIN:?set OTTERTRAIL_DOMAIN in .env}
    labels:
      ottertrail.config.caddyfile: "bbed7980361e"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates and keys: keep this volume, or Caddy asks for new ones on every start.
      - caddy-data:/data
      - caddy-config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - api

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-backups:
  geo-data:
  caddy-data:
  caddy-config:
  garage-data:

# The settings files the services read, held here so this file needs no
# others. Compose replaces ${...} in them with values from .env, so a
# literal dollar sign is written $$.
#
# Compose does not recreate a container when only its config's content
# changes. So each service carries a label with the first 12 hex digits of
# each config's SHA-256 (of the text as written here): a release that
# changes a config changes its label, and `up -d` recreates the service.
# apps/api/tests/deploy-files.test.ts fails when a label is out of date,
# and names the right value. The development stack
# (compose.yaml at the repository root) reads the same ClickHouse and
# Garage settings from deploy/clickhouse/ and deploy/garage/; a test
# (apps/api/tests/deploy-files.test.ts) fails when the two differ.
configs:
  # Caddy gets and renews the HTTPS certificate for the instance's domain,
  # redirects HTTP to HTTPS, and passes every request to the API. It
  # replaces any X-Forwarded-For a client sends with the client's real
  # address, which the API reads (TRUST_PROXY=1). It compresses every
  # answer but the Settings page's Server log, a stream of events, whose
  # lines would wait in the compressor; Caddy passes each event on at once.
  caddyfile:
    content: |
      {$$OTTERTRAIL_DOMAIN} {
      	@compressible not path /api/settings/server-log
      	encode @compressible zstd gzip
      	reverse_proxy api:3000
      }

  # ClickHouse on a small server it shares (docs/storage-benchmark.md).
  clickhouse-config:
    content: |
      <!--
        ClickHouse on a small server it shares with PostgreSQL, the API, and the
        worker, such as 8 GB in all. ClickHouse's defaults assume a machine of its
        own with 16 GB or more; its own guide suggests these changes for less
        (https://clickhouse.com/docs/operations/tips). deploy/compose.yaml holds
        this file inline; the development stack (compose.yaml at the repository
        root) reads the copy in deploy/clickhouse/. A test keeps the two the same.
      -->
      <clickhouse>
          <!-- At most 40% of the machine's memory. A query that would go over fails
               on its own instead of the kernel killing the whole server. -->
          <max_server_memory_usage_to_ram_ratio>0.4</max_server_memory_usage_to_ram_ratio>

          <!-- 512 MiB instead of 5 GiB: the guide's lowest suggestion. -->
          <mark_cache_size>536870912</mark_cache_size>

          <!-- Internal logs Ottertrail never reads. Each costs memory and disk. -->
          <trace_log remove="1"/>
          <text_log remove="1"/>
          <metric_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <part_log remove="1"/>
          <processors_profile_log remove="1"/>
          <query_metric_log remove="1"/>
          <error_log remove="1"/>
          <background_schedule_pool_log remove="1"/>
          <instrumentation_trace_log remove="1"/>
          <opentelemetry_span_log remove="1"/>
          <iceberg_metadata_log remove="1"/>
          <delta_lake_metadata_log remove="1"/>

          <!-- The logs kept get a time limit: ClickHouse keeps them forever by
               default, on the disk the data shares. query_log has a row for every
               query and insert; tests read it to measure queries, and an operator
               can look up a slow one there. -->
          <query_log>
              <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
          </query_log>
          <backup_log>
              <ttl>event_date + INTERVAL 30 DAY DELETE</ttl>
          </backup_log>
          <crash_log>
              <ttl>event_date + INTERVAL 30 DAY DELETE</ttl>
          </crash_log>

          <logger>
              <level>warning</level>
          </logger>

          <!-- Where BACKUP ... TO File('name.zip') writes, and RESTORE reads
               (docs/deployment.md, "Backups"). deploy/compose.yaml mounts a volume
               of its own here, which the worker reads for scheduled backups. -->
          <backups>
              <allowed_path>/var/lib/clickhouse/backups/</allowed_path>
          </backups>

          <!-- Refuse inserts while less than 5% of the disk is free, rather than
               fill it: PostgreSQL, Garage, and backups share the disk, and
               PostgreSQL stops when its write-ahead log cannot grow. Collection
               then answers 503 and the tracker retries. A MergeTree setting, here
               the default of every table; the system database is never refused.
               Docs: https://clickhouse.com/docs/operations/settings/merge-tree-settings;
               the check: src/Storages/MergeTree/MergeTreeDataWriter.cpp#L866-L900
               at tag v26.8.38.9-lts. -->
          <merge_tree>
              <min_free_disk_ratio_to_perform_insert>0.05</min_free_disk_ratio_to_perform_insert>
          </merge_tree>
      </clickhouse>

  clickhouse-users:
    content: |
      <!--
        Limits for every query on a small server (see config.d/ottertrail.xml).
        Reports work out visits by sorting a range's events; past these sizes the
        sort and grouping continue on disk instead of failing (docs/storage-benchmark.md).
      -->
      <clickhouse>
          <profiles>
              <default>
                  <max_memory_usage>1000000000</max_memory_usage>
                  <max_bytes_before_external_sort>400000000</max_bytes_before_external_sort>
                  <max_bytes_before_external_group_by>400000000</max_bytes_before_external_group_by>
              </default>
          </profiles>
      </clickhouse>

  # Garage: one node. Its secret, access key, and bucket come from the
  # environment (the garage service above), not from here.
  garage:
    content: |
      # Garage, the S3-compatible object store for session replays and source
      # maps: one node, as an install runs it. Its secret, access key, and
      # bucket come from the environment, not from here. deploy/compose.yaml
      # holds this file inline; the development stack reads the copy in
      # deploy/garage/. A test keeps the two the same.
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

      # The admin API, for the instance's Storage page and the bucket's quota
      # (docs/deployment.md, "Storage"). Its token comes from the environment
      # (GARAGE_ADMIN_TOKEN), not from here; without one, Garage refuses every
      # admin request, and the worker checks that it does at start. Only the API
      # and the worker reach this port, inside the Compose network. /metrics
      # needs a metrics token, and none is set: Garage refuses it to everyone.
      [admin]
      api_bind_addr = "[::]:3903"
      metrics_require_token = true
