# Refresh apps/api/src/enrichment/referrer-spam/list.ts from Matomo.
# PRs opened with GITHUB_TOKEN start no other workflows, so run checks here.
# The bot owns bot/referrer-spam-list and force-updates it.
# Enable "Allow GitHub Actions to create and approve pull requests"
# (Settings, Actions, General). See docs/development.md, "Maintenance".
name: Referrer spam list

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: referrer-spam
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ottertrail/ottertrail'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: bot/referrer-spam-list
      LIST: apps/api/src/enrichment/referrer-spam/list.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download and check the list
        id: update
        env:
          # More GitHub API requests than an address gets without a token.
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node apps/api/scripts/update-referrer-spam.ts | tee "$RUNNER_TEMP/update.txt"
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            0) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The referrer spam list was not updated (exit $status). See the log above."
               exit 1 ;;
          esac

      # GITHUB_TOKEN PRs start no other workflows. Check before pushing.
      - name: Install dependencies
        if: steps.update.outputs.changed == 'true'
        run: |
          npm install --global pnpm@12.21.0
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the new list
        if: steps.update.outputs.changed == 'true'
        run: |
          pnpm exec vp check
          pnpm --filter @ottertrail/api exec vp test run tests/spam-rules.test.ts

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add -- "$LIST"
          git commit --message "chore: update the referrer spam list"
          git push --force origin "$BRANCH"

          {
            echo "Updates the referrer spam list shipped in the repository from Matomo's community list (\`vp run referrer-spam:update\`)."
            echo
            grep -E '^(Matomo commit|Added|Removed)' "$RUNNER_TEMP/update.txt" | cut -c1-3000 | sed 's/^/- /'
            echo
            echo "Review the added domains before merging: a listed domain drops every visit it refers, so make sure none is a real site."
          } > "$RUNNER_TEMP/body.md"

          open=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "chore: update the referrer spam list" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update the referrer spam list" --body-file "$RUNNER_TEMP/body.md"
          fi
